                <h1>炎熱天氣下需注意事項</h1>
                <div class="border_blank">
                    <br /><!--Social Network --> <!-- End Social Network -->
<ol>
<li>在炎熱天氣下或高溫環境中工作的人士，請參照勞工處的<a href="https://www.labour.gov.hk/common/public/oh/Heat_Stress_GN_tc.pdf">預防工作時中暑指引</a>，採取所需的防暑措施。 &nbsp;</li>
<li>在戶外活動的人士，應留意身體健康狀況。帶備食水及防曬用品。 &nbsp;</li>
<li>減少長時間在陽光下曝曬。 &nbsp;</li>
<li>保持室內空氣流通。 &nbsp;</li>
<li>請關注長者或慢性病患者的健康狀況。如認識他們，請間中致電或探訪他們，看看是否需要提供幫助。</li>
</ol>
