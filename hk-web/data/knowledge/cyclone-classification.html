                <div class="border_blank">
                    <!--Content Start-->
					<h2>熱帶氣旋之分類</h2>
					<p class="MsoNormal">依照世界氣象組織之建議，熱帶氣旋是根據接近風暴中心之最高持續風力加以分類的。香港採用的分類定義以10分鐘平均風速為根據，分為以下六種：</p>
					<table style="width:100%;" class="table_border_0">
						<tbody>
							<tr>
								<td style="height:34px;" class="td_valign_top"><span><u>熱帶氣旋類別</u></span></td>
								<td class="td_valign_top">&nbsp;</td>
								<td class="td_valign_top"><span><u>接近風暴中心之10分鐘最高平均風力</u></span></td>
							</tr>
							<tr>
								<td>熱帶低氣壓</td>
								<td>&nbsp;</td>
								<td>每小時41至62公里 </td>
							</tr>
							<tr>
								<td>熱帶風暴</td>
								<td>&nbsp;</td>
								<td>每小時63至87公里</td>
							</tr>
							<tr>
								<td>強烈熱帶風暴</td>
								<td>&nbsp;</td>
								<td>每小時88至117公里</td>
							</tr>
							<tr>
								<td>颱風</td>
								<td>&nbsp;</td>
								<td>每小時118至149公里</td>
							</tr>
							<tr>
								<td>強颱風*</td>
								<td>&nbsp;</td>
								<td>每小時150至184公里</td>
							</tr>
							<tr>
								<td>超強颱風*</td>
								<td>&nbsp;</td>
								<td>每小時185公里或以上</td>
							</tr>
					</tbody>
					</table><br>
